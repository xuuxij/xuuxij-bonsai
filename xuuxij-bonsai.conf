# xuuxij-bonsai settings: one "key = value" per line.
# Read again before every tree, so a change shows on the next tree.
# xuuxij-bonsai --help explains each one; --print-config shows what it will use.

# Its form
style = auto         # auto (drawn by the weights below), or one of:
                     #   moyogi (informal upright)  chokkan (formal upright)  shakan (slanting)
                     #   bunjin (literati)  kengai (cascade)
                     # or the name of a form of your own in ~/.config/xuuxij-bonsai/styles/
styles = moyogi:15 chokkan:10 shakan:30 bunjin:30 kengai:15   # how often each form appears
cycle = 10m          # every tree gets exactly this long, first cell to the next tree's first
                     # cell, by pacing: it grows in a quarter of it, the leaves let go in time,
                     # the bare tree stands until the crumble's moment (0 = no clock)
twin = auto          # a twin trunk: auto (a fifth of the uprights and slanting trees), yes or no
height = 0.6         # the height budget; every form scales with it (0.6 = as designed)
width = 0.75         # the width budget; every form scales with it (0.75 = as designed)
leafiness = 1.0      # size of the clouds of foliage (0.3 to 3)
leaves = auto        # characters inside a cloud: auto (drawn per tree from &* , *^ , %&) or your own
leaf_edge = .,'      # characters around a cloud's edge

# How it grows
step = 0.1           # seconds per cell a branch grows sideways; bigger = slower (0 to 10)
fronts = 1           # strokes drawn at the same time (1 = a single pen, up to 8)
aspect = 2.0         # how much longer a step up takes than a step sideways (1 to 3)
ease = 1.0           # how much a branch slows toward its end (0 = steady, up to 2)
gap = 8              # pause before a new stroke starts, in steps (0 to 20)
bud_delay = 15       # steps before a bud (.) opens into a leaf (0 = no buds, up to 60)
highlight = yes      # a bright tip travels along each growing branch

# Its autumn (with a cycle set, fall and bare are paced by the clock instead)
wait = 45            # seconds a finished tree stays before its leaves turn
autumn = 70          # seconds the leaves take to change colour, top pad first
autumn_colors = yellow red   # the colours the leaves turn, in order
fall = 180           # seconds the leaves take to fall
bare = 12            # seconds the bare tree is held before it crumbles
crumble = 20         # seconds the bare tree takes to crumble into the planter
pile = 2             # rows the fallen leaves may heap up above the soil, a stand or the table (0 to 20)

# Its look
trunk_color = yellow # black red green yellow blue magenta cyan white
leaf_color = green
pot = auto           # auto (the run's planter: the wide Teizan rectangle or the glazed oval,
                     # really wide, on a stand half the time; a cascade brings its own tall
                     # hexagon and stand), no, or one of:
                     #   teizan oval drum celadon hexagon bunjin
                     # or the name of a planter of your own in ~/.config/xuuxij-bonsai/pots/
stand = auto         # a rosewood display stand under the planter: auto, yes or no
pot_color = auto     # the planter's body colour: auto (each design's own) or a colour
trim_color = auto    # the planter's trim colour: auto or a colour
stand_color = red    # the stand's colour (red = rosewood)
seed = none          # a number = the same trees every time; none = random
